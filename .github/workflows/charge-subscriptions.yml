name: Charge Toss Subscriptions

on:
  # Every day at 00:10 KST (15:10 UTC)
  schedule:
    - cron: '10 15 * * *'
  # Allow manual run from GitHub Actions tab
  workflow_dispatch:

jobs:
  charge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call charge-subscriptions Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            echo "Add it in Repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            https://vziegzjeysteemjxgbnc.supabase.co/functions/v1/charge-subscriptions)"

          body="$(printf '%s' "$response" | sed '$d')"
          code="$(printf '%s' "$response" | tail -n 1)"

          echo "HTTP ${code}"
          echo "$body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
