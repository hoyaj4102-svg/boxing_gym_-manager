name: Charge Toss Subscriptions

on:
  # Every day at 00:10 KST (15:10 UTC)
  schedule:
    - cron: '10 15 * * *'
  # Allow manual run from GitHub Actions tab
  workflow_dispatch:

jobs:
  charge:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Validate production billing scheduler configuration
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing GitHub secret: SUPABASE_URL"
            echo "Add it in the protected production environment secrets"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            echo "Add it in the protected production environment secrets"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "Missing GitHub variable: SUPABASE_PROJECT_ID"
            echo "Add it in the protected production environment variables"
            exit 1
          fi

          node <<'NODE'
          const configuredUrl = process.env.SUPABASE_URL || "";
          const expectedProjectId = process.env.SUPABASE_PROJECT_ID || "";
          let parsed;
          try {
            parsed = new URL(configuredUrl);
          } catch {
            console.error("SUPABASE_URL is not a valid URL");
            process.exit(1);
          }

          if (parsed.protocol !== "https:") {
            console.error("SUPABASE_URL must use https");
            process.exit(1);
          }

          if (!parsed.hostname.endsWith(".supabase.co")) {
            console.error("SUPABASE_URL must point to a Supabase project host");
            process.exit(1);
          }

          const actualProjectId = parsed.hostname.split(".")[0];
          if (!actualProjectId || actualProjectId !== expectedProjectId) {
            console.error("SUPABASE_URL project ref does not match SUPABASE_PROJECT_ID");
            process.exit(1);
          }
          NODE

      - name: Call billing scheduler Edge Functions in order
        run: |
          set -euo pipefail

          call_edge_function() {
            local function_name="$1"
            local response
            local code
            local endpoint="${SUPABASE_URL%/}/functions/v1/${function_name}"

            if ! response="$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              "${endpoint}")"; then
              echo "${function_name} request failed before an HTTP response"
              exit 1
            fi

            code="$(printf '%s' "$response" | tail -n 1)"

            echo "${function_name} HTTP ${code}"

            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "${function_name} response body omitted to avoid logging billing data"
              exit 1
            fi
          }

          call_edge_function "charge-subscriptions"
          call_edge_function "reconcile-auto-renewal-payments"
          call_edge_function "reconcile-initial-billing-payments"
