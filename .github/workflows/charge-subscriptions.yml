name: Charge Toss Subscriptions

# The production schedule is intentionally absent.
# Enabling a live or scheduled run needs a separate approval.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run only. This does not call a payment provider.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run

jobs:
  dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Run billing scheduler dry run
        env:
          BILLING_SCHEDULER_MODE: dry-run
        run: node scripts/check-billing-scheduler-dry-run.mjs
