# Minimal Supabase config for Edge Functions deploy

[functions.create-checkout]
verify_jwt = true

[functions.confirm-toss-payment]
verify_jwt = true

[functions.billing-webhook]
verify_jwt = false

# Cron uses CRON_SECRET (not a Supabase JWT)
[functions.charge-subscriptions]
verify_jwt = false

[functions.reconcile-auto-renewal-payments]
verify_jwt = false

[functions.reconcile-initial-billing-payments]
verify_jwt = false

[functions.toss-webhook]
verify_jwt = false

[functions.cancel-payment]
verify_jwt = true

[functions.payment-receipt]
verify_jwt = true

# Manual test-mode retry only. No schedule is declared.
[functions.retry-failed-payments]
verify_jwt = false
