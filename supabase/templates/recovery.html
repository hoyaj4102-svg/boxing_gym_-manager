<!DOCTYPE html>
<html lang="ko">
<body>
{{ if eq .Data.locale "en" }}
<h2>Reset your password</h2>
<p>We received a request to reset your re;member password.</p>
<p><a href="{{ .ConfirmationURL }}">Reset password</a></p>
<p>If you did not request this, you can ignore this email.</p>
{{ else }}
<h2>비밀번호를 다시 설정해 주세요</h2>
<p>re;member 비밀번호 재설정 요청을 받았습니다.</p>
<p><a href="{{ .ConfirmationURL }}">비밀번호 재설정</a></p>
<p>요청하지 않았다면 이 메일은 무시해도 됩니다.</p>
{{ end }}
</body>
</html>
